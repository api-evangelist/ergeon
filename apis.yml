aid: ergeon
name: Ergeon
description: >-
  Ergeon is a nationwide outdoor residential construction company that installs
  fencing (wood, vinyl, metal, and chain-link), artificial grass, wooden decks,
  and concrete driveways, patios, and walkways. It pairs a distributed workforce
  with technology — live video estimates, a 3D fence-quoting calculator at
  fencequoting.com, satellite site-plan tooling, and a customer portal — to
  deliver fast, accurate quotes plus managed installation with permit handling,
  financing (Wisetack), and workmanship warranties. Ergeon runs internal software
  and vendor integrations (Stripe, Twilio, Talkdesk, AWS, Lob) but does not
  publish a public developer API; this profile captures its public web, status,
  and open-source surface for the API Evangelist network.
